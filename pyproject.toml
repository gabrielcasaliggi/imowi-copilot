[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "e2e_conv: escenarios conversacionales multi-turno (tests/e2e_conv); correr aparte del resto de la suite",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "data",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
    "B008",
    "UP042",
    "E741",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
