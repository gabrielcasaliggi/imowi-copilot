# Eco TTS — SOLO voz femenina argentina (Edge es-AR-ElenaNeural).
# IMPORTANTE: recrear imagen; el Coqui CSS10 viejo suena masculino de España.
#
#   docker compose -f docker-compose.tts.yml down
#   docker compose -f docker-compose.tts.yml build --no-cache
#   docker compose -f docker-compose.tts.yml up -d --force-recreate
#   curl -s http://127.0.0.1:9100/health
#   → "voice":"es-AR-ElenaNeural","gender":"Female","locale":"es-AR"
#
# Requiere HTTPS saliente del contenedor (Microsoft Edge TTS).
services:
  tts:
    container_name: operations-hub-tts-elena-ar
    build: ./tts
    ports:
      - "9100:9100"
    environment:
      # Fijas: no heredar TTS_ENGINE=coqui ni voces es-ES del .env del host
      TTS_VOICE: es-AR-ElenaNeural
      TTS_FORCE_FEMALE: "true"
      TTS_RATE: "+0%"
      TTS_PITCH: "+0Hz"
      TTS_MAX_CHARS: "800"
      TTS_OPUS_BITRATE: "64k"
    restart: unless-stopped
    mem_limit: 1g

volumes:
  tts-models:
