# Eco TTS — voz femenina argentina (Edge es-AR-ElenaNeural) por defecto.
# Uso: docker compose -f docker-compose.tts.yml up -d --build
# API: POST http://localhost:9100/synthesize  {"text":"..."} → audio/ogg
#
# Requiere salida HTTPS del contenedor (Microsoft Edge TTS).
# Offline / Coqui: TTS_ENGINE=coqui (imagen legacy con torch; ver docs/ECO-TTS.md).
services:
  tts:
    build: ./tts
    ports:
      - "9100:9100"
    environment:
      TTS_ENGINE: ${TTS_ENGINE:-edge}
      TTS_VOICE: ${TTS_VOICE:-es-AR-ElenaNeural}
      TTS_RATE: ${TTS_RATE:-+0%}
      TTS_PITCH: ${TTS_PITCH:-+0Hz}
      TTS_MAX_CHARS: ${TTS_MAX_CHARS:-800}
      TTS_OPUS_BITRATE: ${TTS_OPUS_BITRATE:-64k}
    volumes:
      - tts-models:/models
    restart: on-failure
    # Edge no carga modelo local; 512M sobra. Subí si usás coqui.
    mem_limit: 1g

volumes:
  tts-models:
