# Reverse proxy nativo — Operations Hub (ibot.ecolan.com)
# Frontend Next.js :3000  ·  API FastAPI :8000  (solo localhost)
#
# Certbot agrega el bloque SSL. Este archivo es el site HTTP base (+ redirect tras HTTPS).

upstream ops_hub_api {
    server 127.0.0.1:8000;
}

upstream ops_hub_frontend {
    server 127.0.0.1:3000;
}

# Bloque común de proxy (incluido desde server HTTP/HTTPS)
# Los location viven en cada server{} para que certbot pueda modificar listen/ssl.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ibot.ecolan.com;

    client_max_body_size 25m;

    # Let's Encrypt HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location /api/ {
        proxy_pass http://ops_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ops_hub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
