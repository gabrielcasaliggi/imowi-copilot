# Reverse proxy nativo — Operations Hub (ibot.ecolan.com)
# Frontend Next.js :3000  ·  API FastAPI :8000  (solo localhost)
#
# Certbot agrega el bloque SSL. Este archivo es el site HTTP base (+ redirect tras HTTPS).
# Tras HTTPS, en el server :443 agregar:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

upstream ops_hub_api {
    server 127.0.0.1:8000;
}

upstream ops_hub_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ibot.ecolan.com;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Let's Encrypt HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location /api/ {
        proxy_pass http://ops_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness (DB) — mismo upstream que /health; no dejar que Next responda 404
    location /ready {
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI: en prod restringir a VPN/admin (descomentar allow/deny)
    location /docs {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
    }

    location /redoc {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://ops_hub_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ops_hub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
